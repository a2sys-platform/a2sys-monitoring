# Overlay: wire the a2sys-bench Cloud SQL (Postgres) into Grafana as a datasource.
# Apply ON TOP of values.yaml AFTER the PSC endpoint exists and the `bench-db`
# secret is created (see db-connection/README.md):
#   helm upgrade --install a2sys-monitoring prometheus-community/kube-prometheus-stack \
#     -n a2sys-monitoring -f values.yaml -f values-db.yaml
#
# Grafana connects DIRECTLY to the DB over the PSC internal IP (no Auth Proxy needed).
# Host/user/password come from the k8s Secret `bench-db` (NOT stored in this repo).

grafana:
  envValueFrom:
    DB_HOST:
      secretKeyRef:
        name: bench-db
        key: host
    DB_USER:
      secretKeyRef:
        name: bench-db
        key: user
    DB_PASS:
      secretKeyRef:
        name: bench-db
        key: password
  additionalDataSources:
    - name: a2sys-bench
      type: postgres
      access: proxy
      url: $DB_HOST:5432
      user: $DB_USER
      jsonData:
        database: a2sys_bench
        sslmode: require
        postgresVersion: 1600
      secureJsonData:
        password: $DB_PASS
