# Overlay: extra Grafana datasources.
#   - GMP         : Google Managed Prometheus (metrics), via the gmp-frontend proxy — see gmp/
#   - a2sys-bench : a2sys-bench Cloud SQL (Postgres), via PSC internal IP — see db-connection/
# Both datasources MUST live in this one list (Helm replaces lists, it does not merge them).
# Apply on top of values.yaml:
#   helm upgrade --install a2sys-monitoring prometheus-community/kube-prometheus-stack \
#     -n a2sys-monitoring -f values.yaml -f values-db.yaml
# Prereqs: gmp/frontend.yaml applied + monitoring.viewer granted (gmp/README.md);
# PSC endpoint + `bench-db` secret created (db-connection/README.md).
# The DB host/user/password come from the k8s Secret `bench-db` (NOT stored in this repo).

grafana:
  # remove the stale default datasources persisted on the PVC from the earlier
  # (Prometheus-enabled) install; they are read-only and can't be deleted via API.
  deleteDatasources:
    - name: Prometheus
      orgId: 1
    - name: Alertmanager
      orgId: 1
  envValueFrom:
    DB_HOST:
      secretKeyRef:
        name: bench-db
        key: host
    DB_USER:
      secretKeyRef:
        name: bench-db
        key: user
    DB_PASS:
      secretKeyRef:
        name: bench-db
        key: password
  additionalDataSources:
    - name: GMP
      type: prometheus
      access: proxy
      url: http://gmp-frontend.a2sys-monitoring.svc:9090
      isDefault: true
      jsonData:
        httpMethod: POST
        prometheusType: Prometheus
    - name: a2sys-bench
      type: postgres
      access: proxy
      url: $DB_HOST:5432
      user: $DB_USER
      jsonData:
        database: a2sys_bench
        sslmode: require
        postgresVersion: 1600
      secureJsonData:
        password: $DB_PASS
