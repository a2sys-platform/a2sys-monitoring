# kube-prometheus-stack values for a2sys-monitoring — GRAFANA-ONLY
# Cluster: devops-dev (a2sys-devops-dev, asia-northeast3) / namespace: a2sys-monitoring
# Chart: prometheus-community/kube-prometheus-stack
#
# We run ONLY Grafana from this chart. Self-managed Prometheus, Alertmanager,
# prometheus-operator and kube-state-metrics are disabled to cut Autopilot cost —
# metrics come from Google Managed Prometheus (GMP, already on this cluster;
# see db-connection/ and gmp/ for datasources). node-exporter and control-plane
# scrapers stay off (Autopilot forbids them).

prometheus:
  enabled: false
alertmanager:
  enabled: false
prometheusOperator:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false

grafana:
  service:
    type: LoadBalancer
  # admin credentials come from the pre-created Secret `grafana-admin` (not stored in this repo)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # keep the dashboard/datasource sidecars small — otherwise Autopilot defaults
  # unset requests to 500m / 2Gi each.
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    datasources:
      # We removed self-managed Prometheus/Alertmanager, so don't provision the
      # chart's default datasources that point at those (now-dead) services.
      # GMP (defined in values-db.yaml) is the metrics datasource instead.
      defaultDatasourceEnabled: false
      alertmanager:
        enabled: false
