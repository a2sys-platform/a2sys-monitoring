# grafana/grafana chart values for a2sys-monitoring
# Cluster: devops-dev (a2sys-devops-dev, asia-northeast3) / namespace: a2sys-monitoring
# Chart: grafana/grafana
#
# Grafana only. Metrics come from Google Managed Prometheus (see gmp/); the
# a2sys-bench Cloud SQL datasource is in db-connection/. Datasources themselves
# are defined in values-db.yaml.

service:
  type: LoadBalancer

# admin credentials come from the pre-created Secret `grafana-admin` (not in this repo)
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
